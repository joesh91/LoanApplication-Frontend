<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Make Payment</title>

<!-- Bootstrap CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Our CSS -->
<link rel="stylesheet" href="../css/stylecus.css">


</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark fixed-top">

    <div class="container">

        <a class="navbar-brand">
            Loan Application System
        </a>

        <div class="d-flex align-items-center">

            <span
                class="text-white ms-3 me-3"
                id="customer">
                Customer
            </span>

            <a
                class="btn btn-outline-light me-2"
                id="dashboard"
                href="customer-dashboard.html">
                Dashboard
            </a>

            <button
                type="button"
                class="btn btn-outline-light"
                id="logoutButton">
                Logout
            </button>

        </div>

    </div>

</nav>


<!-- ================= MAIN CONTENT ================= -->

<main class="container page-container mt-5 mb-5 py-5">

    <!-- PAGE HEADER -->

    <div class="page-header">

        <h2>Make a Payment</h2>

        <p>
            Make a payment toward your loan.
        </p>

    </div>


    <!-- ================= PAYMENT CARD ================= -->

    <div class="page-card">

        <div class="card-header">

            <h5>Payment Information</h5>

        </div>


        <div class="card-body">

            <form id="paymentForm">

                <!-- LOAN ID -->

                <div class="mb-4">

                    <label
                        for="loanId"
                        class="form-label">
                        Loan ID
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="loanId"
                        readonly>

                    <div class="form-text">
                        This loan was selected from your loan records.
                    </div>

                </div>


                <!-- PAYMENT AMOUNT -->

                <div class="mb-4">

                    <label
                        for="amount"
                        class="form-label">
                        Payment Amount
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="amount"
                        placeholder="Enter payment amount"
                        min="1"
                        step="0.01"
                        required>

                </div>


                <!-- PAYMENT STATUS -->

                <div class="mb-4">

                    <label
                        for="paymentStatus"
                        class="form-label">
                        Payment Status
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="paymentStatus"
                        value="PENDING"
                        readonly>

                    <div class="form-text">
                        Payment status is automatically assigned by the system.
                    </div>

                </div>


                <!-- MESSAGE -->

                <div
                    id="paymentMessage"
                    class="mb-4">
                </div>


                <!-- BUTTONS -->

                <div class="mt-4 pt-3 border-top">

                    <button
                        type="submit"
                        class="btn btn-primary me-2"
                        id="makePaymentButton">

                        Make Payment

                    </button>

                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="cancelButton">

                        Cancel

                    </button>

                </div>

            </form>

        </div>

    </div>

</main>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Make Payment JS -->

<script src="../js/make-payment.js"></script>


</body>

</html>
