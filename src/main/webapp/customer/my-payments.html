<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Payments</title>

<!-- Bootstrap CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Our CSS -->
<link rel="stylesheet" href="../css/stylecus.css">


</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark fixed-top">

    <div class="container">

        <a
            class="navbar-brand"
            href="customer-dashboard.html">

            Loan Application System

        </a>


        <div class="d-flex align-items-center">

            <span
                class="text-white ms-3 me-3"
                id="customer">

                Customer

            </span>


            <a
                class="btn btn-outline-light me-2"
                id="dashboard"
                href="customer-dashboard.html">

                Dashboard

            </a>


            <button
                type="button"
                class="btn btn-outline-light"
                id="logout">

                Logout

            </button>

        </div>

    </div>

</nav>


<!-- ================= MAIN CONTENT ================= -->

<main class="container page-container mt-5 mb-5 py-5">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <h2>My Payments</h2>

        <p>
            View your payment history and payment status.
        </p>

    </div>


    <!-- ================= PAYMENT CARD ================= -->

    <div class="dashboard-table-card">

        <div class="card-body">


            <!-- PAYMENT TABLE -->

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>

                        <tr>

                            <th>Payment ID</th>

                            <th>Loan ID</th>

                            <th>Amount</th>

                            <th>Payment Date</th>

                            <th>Status</th>

                        </tr>

                    </thead>


                    <tbody id="paymentTableBody">

                        <tr>

                            <td
                                colspan="5"
                                class="text-center text-muted">

                                Loading payments...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- ================= BACK BUTTON ================= -->

    <div class="mt-4">

        <a
            href="customer-dashboard.html"
            class="btn btn-secondary">

            Back to Dashboard

        </a>

    </div>

</main>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Page JavaScript -->

<script src="../js/my-payments.js"></script>


</body>

</html>
