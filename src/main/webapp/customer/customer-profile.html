<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<!-- Bootstrap CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Our CSS -->
<link rel="stylesheet" href="../css/stylecus.css">


</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark fixed-top">

    <div class="container">

        <a class="navbar-brand">
            Loan Application System
        </a>

        <div class="d-flex align-items-center">

            <span
                class="text-white ms-3 me-3"
                id="customer">
                Customer
            </span>

            <a
                class="btn btn-outline-light me-2"
                id="dashboard"
                href="customer-dashboard.html">
                Dashboard
            </a>

            <button
                type="button"
                class="btn btn-outline-light"
                id="logoutButton">
                Logout
            </button>

        </div>

    </div>

</nav>


<!-- ================= MAIN CONTENT ================= -->

<main class="container page-container mt-5 mb-5 py-5">

    <!-- PAGE HEADER -->

    <div class="page-header">

        <h2>My Profile</h2>

        <p>
            View your personal and contact information.
        </p>

    </div>


    <!-- PROFILE CARD -->

    <div class="page-card">

        <div class="card-header">

            <h5>Customer Information</h5>

        </div>


        <div class="card-body">

            <!-- Loading message -->

            <div
                class="alert alert-info"
                id="loadingMessage">

                Loading profile...

            </div>


            <!-- Error message -->

            <div
                class="alert alert-danger d-none"
                id="errorMessage">
            </div>


            <!-- Profile details -->

            <div
                class="d-none"
                id="profileDetails">

                <div class="row g-4">

                    <!-- First Name -->

                    <div class="col-md-6">

                        <div class="detail-item">

                            <label
                                for="firstName"
                                class="detail-label">
                                First Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="firstName"
                                readonly>

                        </div>

                    </div>


                    <!-- Last Name -->

                    <div class="col-md-6">

                        <div class="detail-item">

                            <label
                                for="lastName"
                                class="detail-label">
                                Last Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="lastName"
                                readonly>

                        </div>

                    </div>


                    <!-- NIC -->

                    <div class="col-md-6">

                        <div class="detail-item">

                            <label
                                for="nic"
                                class="detail-label">
                                NIC
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nic"
                                readonly>

                        </div>

                    </div>


                    <!-- Email -->

                    <div class="col-md-6">

                        <div class="detail-item">

                            <label
                                for="email"
                                class="detail-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                readonly>

                        </div>

                    </div>


                    <!-- Phone -->

                    <div class="col-md-6">

                        <div class="detail-item">

                            <label
                                for="phone"
                                class="detail-label">
                                Phone
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="phone"
                                readonly>

                        </div>

                    </div>


                    <!-- Address -->

                    <div class="col-12">

                        <div class="detail-item">

                            <label
                                for="address"
                                class="detail-label">
                                Address
                            </label>

                            <textarea
                                id="address"
                                class="form-control"
                                rows="3"
                                readonly></textarea>

                        </div>

                    </div>

                </div>


                <!-- BACK BUTTON -->

                <div class="mt-4 pt-3 border-top">

                    <a
                        href="customer-dashboard.html"
                        class="btn btn-secondary">

                        Back to Dashboard

                    </a>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- JavaScript -->

<script src="../js/customer-profile.js"></script>

</body>

</html>
