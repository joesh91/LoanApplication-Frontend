<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Dashboard</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Our CSS -->
<link rel="stylesheet" href="../css/style.css">


</head>
<body>

	<!-- ================= NAVBAR ================= -->

	<nav class="navbar navbar-dark bg-dark">

		<div class="container">

			<a class="navbar-brand"> Loan Application System </a>

			<div class="d-flex align-items-center">

				<span class="text-white ms-3 me-3" id="customer"> Customer </span>

				<button class="btn btn-outline-light" id="logoutButton">
					Logout</button>

			</div>

		</div>

	</nav>

	<!-- MAIN CONTENT -->

	<div class="container mt-5">

		<div class="row justify-content-center">

			<div class="mol-md-6">

				<div class="card shadow">

					<div class="card-header">

						<h3 class="mb-0">My Profile</h3>

					</div>

					<div class="card-body">

						<!-- Loading message -->
						<div class="text-center" id="loadingMessage">

							<p>Loading profile...</p>

						</div>

						<!-- Error message -->

						<div class="alert alert-danger d-none" id="errorMessage"></div>

						<!-- Customer details -->

						<div class="d-none" id="profileDetails">

							<div class="row mb-3">

								<div class="col-md-6">

									<label for="firstName" class="form-label"> First Name </label>

									<input type="text" class="form-control" id="firstName" readonly />

								</div>


								<div class="col-md-6">

									<label for="lastName" class="form-label"> Last Name </label> <input
										type="text" class="form-control" id="lastName" readonly />

								</div>

							</div>

							<div class="mb-3">

								<label for="nic" class="form-label"> NIC </label> <input
									type="text" class="form-control" id="nic" readonly />

							</div>

							<div class="mb-3">

								<label for="email" class="form-label"> Email </label> <input
									type="email" class="form-control" id="email" readonly />

							</div>

							<div class="mb-3">

								<label for="phone" class="form-label"> Phone </label> <input
									type="text" class="form-control" id="phone" readonly />

							</div>

							<div class="mb-3">

								<label for="address" class="form-label"> Address </label>

								<textarea id="address" class="form-control" rows="3" readonly> 
								
								</textarea>

							</div>

							<div class="mt-4">

								<a href="customer-dashboard.html" class="btn btn-secondary">

									Back to Dashboard </a>

							</div>


						</div>

					</div>

				</div>

			</div>

		</div>

	</div>

<script src="../js/customer-profile.js"></script>
</body>
</html>
