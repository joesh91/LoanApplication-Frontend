<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply for Loan</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Our CSS -->
<link rel="stylesheet" href="../css/style.css">


</head>
<body>

	<!-- ================= NAVBAR ================= -->

	<nav class="navbar navbar-dark bg-dark">

		<div class="container">

			<a class="navbar-brand"> Loan Application System </a>

			<div class="d-flex align-items-center">



				<button class="btn btn-outline-light" id="logout">
					Logout</button>

			</div>

		</div>

	</nav>

	<div class="container mt5">

		<div class="row justify-content-center">

			<div class="col-md-6" style="background-color: khaki">

				<div class="card shadow mt-3">

					<div>

						<h4 class="card-header">Apply for a loan</h4>

					</div>
					<div class="card-body">

						<!-- SUCCESS MESSAGE -->

						<div id="successMessage" class="alert alert-success d-none">
						</div>


						<!-- ERROR MESSAGE -->

						<div id="errorMessage" class="alert alert-danger d-none"></div>

						<!--  LOAN APPLICATION FORM= -->

						<form id="loanApplicationForm">

							<!-- LOAN TYPE -->

							<div class="mb-3 mt-2">

								<label for="loanType" class="form-label"> Loan Type </label> <select
									id="loanType" class="form-select">
									<option value="housingLoan">Housing Loan</option>
									<option value="vehicleLoan">Vehicle Loan</option>
									<option value="personalLoan">Personal Loan</option>
									<option value="businessLoan">Business Loan</option>
									<option value="otherLoan">Other</option>
								</select>

							</div>

							<!-- REQUESTED AMOUNT -->

							<div class="mb-3">

								<label for="requestedAmount" class="form-label">
									Requested Amount </label> <input type="number" class="form-control"
									id="requestedAmount" min="1" step="0.01"
									placeholder="Enter requested amount" />

							</div>

							<!-- PURPOSE -->

							<div class="mb-3">

								<label for="purpose" class="form-label"> Purpose </label>

								<textarea class="form-control" id="purpose" rows="4"
									placeholder="Enter purpose here"> </textarea>

							</div>

							<!-- SUBMIT -->

							<div class="mt-3">

								<button type="submit" class="btn btn-primary" id="submitButton">
									Submit Application</button>

								<button type="button" class="btn btn-secondary" id="backButton">
									Back</button>

							</div>


						</form>

					</div>

				</div>
			</div>

		</div>

	</div>


	<script src="../js/loan-application.js"></script>

</body>
</html>
