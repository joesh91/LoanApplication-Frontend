<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply for Loan</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Our CSS -->
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

	<!-- ================= NAVBAR ================= -->

	 <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="customer-dashboard.html">
                Loan Application System
            </a>

            <div class="d-flex align-items-center">

                <span
                    id="customer"
                    class="text-white me-3">
                </span>

                <button
                    id="logout"
                    class="btn btn-outline-light">
                    Logout
                </button>

            </div>

        </div>

    </nav>
	
	
	<!-- MAIN CONTENT -->
	
	<div class="container mt-5">
	
		<div class="card shadow">
		
			<div class="card-header">
			
				<h4 class="mb-0">
					My Loan Applications.
				</h4>
			
			</div>
			
			<div class="card-body">
			
				 <!-- LOADING MESSAGE -->

                <div
                    id="loadingMessage"
                    class="text-center">

                    <p>
                        Loading your loan applications...
                    </p>

                </div>


                <!-- ERROR MESSAGE -->

                <div
                    id="errorMessage"
                    class="alert alert-danger d-none">
                </div>


                <!-- NO APPLICATIONS MESSAGE -->

                <div
                    id="noApplicationsMessage"
                    class="alert alert-info d-none">

                    You have not submitted any loan applications yet.

                </div>		
                
                 <!-- APPLICATION TABLE -->
                 
                 <div class="table-responsive d-none" id="applicationContainer">
                 
                 	<table class="table table-bordered table-hover align-middle">
                 	
                 		<thead class="table-dark">
                 		
                 			<tr> 
                 			
                 			 	<th>Application ID </th>

                                <th>Loan Type</th>

                                <th>Requested Amount</th>

                                <th>Purpose</th>

                                <th>Status</th>

                                <th>Application Date</th>
                                
                                <th>Action</th>
                 			
                 			</tr>
                 			
                 		</thead>
                 		
                 		<tbody id="applicationsTableBody">
                 		
                 		
                 		</tbody>
                 	
                 	</table>

                 </div>
                 
                   <!--  BUTTONS -->
                   
                   <div class="mt=3">
                   	
                   		<button type="button" class="btn btn-primary" id="applyAnotherLoanButton">
                   			Apply for Another Loan
                   		</button>
                   
                   		<button type="button" class="btn btn-secondary" id="backtoDashBoardButton">
                   			Back to Dashboard
                   		</button>
                   </div>
                 			
			</div>
		
		</div>	
	
	
	</div>
	
	  <!--  JAVASCRIPT -->
	  
	  <script src="../js/my-loan-applications.js"></script>

</body>
</html>
