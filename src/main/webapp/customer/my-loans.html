<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Loans</title>

<!-- Bootstrap CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Our CSS -->
<link rel="stylesheet" href="../css/stylecus.css">

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark fixed-top">

    <div class="container">

        <a
            class="navbar-brand"
            href="customer-dashboard.html">

            Loan Application System

        </a>


        <div class="d-flex align-items-center">

            <span
                class="text-white ms-3 me-3"
                id="customer">

                Customer

            </span>


            <a
                class="btn btn-outline-light me-2"
                id="dashboard"
                href="customer-dashboard.html">

                Dashboard

            </a>


            <button
                type="button"
                class="btn btn-outline-light"
                id="logoutButton">

                Logout

            </button>

        </div>

    </div>

</nav>


<!-- ================= MAIN CONTENT ================= -->

<main class="container page-container mt-5 mb-5 py-5">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <h2>My Loans</h2>

        <p>
            View your active loans and make payments.
        </p>

    </div>


    <!-- ================= LOANS CARD ================= -->

    <div class="dashboard-table-card">

        <div class="card-body">


            <!-- LOADING MESSAGE -->

            <div
                id="loadingMessage"
                class="alert alert-info">

                Loading your loans...

            </div>


            <!-- ERROR / EMPTY MESSAGE -->

            <div id="loanMessage"></div>


            <!-- LOANS TABLE -->

            <div
                class="table-responsive d-none"
                id="loanTableContainer">

                <table
                    class="table table-hover align-middle">

                    <thead>

                        <tr>

                            <th>Loan ID</th>

                            <th>Loan Type</th>

                            <th>Approved Amount</th>

                            <th>Interest Rate</th>

                            <th>Duration</th>

                            <th>Start Date</th>

                            <th>End Date</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="loanTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- ================= BACK BUTTON ================= -->

    <div class="mt-4">

        <button
            type="button"
            class="btn btn-secondary"
            id="backButton">

            Back to Dashboard

        </button>

    </div>

</main>


<!-- ================= BOOTSTRAP JS ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- My Loans JS -->

<script src="../js/my-loans.js"></script>


</body>

</html>
