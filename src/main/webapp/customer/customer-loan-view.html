<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Loan Details</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Our CSS -->
<link rel="stylesheet" href="../css/style.css">


</head>
<body>

	<!-- ================= NAVBAR ================= -->

	<nav class="navbar navbar-dark bg-dark">

		<div class="container">

			<a class="navbar-brand"> Loan Application System </a>

			<div class="d-flex align-items-center">



				<button class="btn btn-outline-light" id="logout">Logout</button>

			</div>

		</div>

	</nav>

	<!-- ================= MAIN CONTENT ================= -->

	<div class="container mt-5">

		<div class="card shadow">

			<div class=card-header>

				<h4 class="card-text ">View Loan Details</h4>
				<p class="text-muted">View selected loan details.</p>

			</div>

			<div class="card-body mt-3">

				<div id="loadingMessage" class="alert alert-info">Loading loan
					details....</div>

				<div id="errorMessage" class="alert alert-danger d-none"></div>

				<div id="loanDetails" class="d-none">

					<div class="row">

						<div class="col-md-6 mb-3">

							<label for="applicationId" class="form-label fw-bold">
								Application ID </label>
							<p id="applicationId" class="form-control-plaintext"></p>

						</div>

						<div class="col-md-6 mb-3">

							<label for="loanType" class="form-label fw-bold"> Loan Type </label>
							<p id="loanType" class="form-control-plaintext"></p>

						</div>

						<div class="col-md-6 mb-3">

							<label for="rquestedAmount" class="form-label fw-bold"> Requested
								Amount </label>
							<p id="rquestedAmount" class="form-control-plaintext"></p>

						</div>

						<div class="col-md-6 mb-3">

							<label for="applicationStatus" class="form-label fw-bold">
								Application Status </label>

							<p id="applicationStatus" class="form-control-plaintext"></p>

						</div>

						<div class="col-md-6 mb-3">

							<label for="applicationDate" class="form-label fw-bold">Application
								Date</label>

							<p id="applicationDate" class="form-control-plaintext"></p>

						</div>

						<div class="col-md-6 mb-3">

							<label for="purpose" class="form-label fw-bold"> Purpose</label>

							<p id="purpose" class="form-control-plaintext"></p>


						</div>

					</div>

					<!-- BUTTONS -->

					<div class="mt-3">

						<button type="button" id="backButton" class="btn btn-secondary">
							Back to My Applications</button>

					</div>

				</div>

			</div>

		</div>

	</div>

	<script src="../js/customer-loan-view.js"></script>

</body>
</html>
