<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Loan Details</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="../css/stylecus.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark fixed-top">

    <div class="container">

        <a class="navbar-brand">
            Loan Application System
        </a>

        <div class="d-flex align-items-center">

            <button
                type="button"
                class="btn btn-outline-light"
                id="logout">

                Logout

            </button>

        </div>

    </div>

</nav>


<!-- ================= MAIN CONTENT ================= -->

<main class="container page-container mt-5 mb-5 py-5">


    <!-- ================= PAGE HEADER ================= -->

    <div class="page-header">

        <h2>
            View Loan Details
        </h2>

        <p>
            View the details of your selected loan application.
        </p>

    </div>


    <!-- ================= LOAN DETAILS CARD ================= -->

    <div class="page-card">

        <div class="card-header">

            <h5>
                Loan Information
            </h5>

        </div>


        <div class="card-body">


            <!-- ================= LOADING ================= -->

            <div
                id="loadingMessage"
                class="alert alert-info">

                Loading loan details....

            </div>


            <!-- ================= ERROR ================= -->

            <div
                id="errorMessage"
                class="alert alert-danger d-none">
            </div>


            <!-- ================= LOAN DETAILS ================= -->

            <div
                id="loanDetails"
                class="d-none">


                <div class="row g-4">


                    <!-- APPLICATION ID -->

                    <div class="col-md-6">

                        <div class="detail-item">

                            <label class="detail-label">
                                Application ID
                            </label>

                            <p
                                id="applicationId"
                                class="detail-value">
                            </p>

                        </div>

                    </div>


                    <!-- LOAN TYPE -->

                    <div class="col-md-6">

                        <div class="detail-item">

                            <label class="detail-label">
                                Loan Type
                            </label>

                            <p
                                id="loanType"
                                class="detail-value">
                            </p>

                        </div>

                    </div>


                    <!-- REQUESTED AMOUNT -->

                    <div class="col-md-6">

                        <div class="detail-item">

                            <label class="detail-label">
                                Requested Amount
                            </label>

                            <p
                                id="rquestedAmount"
                                class="detail-value">
                            </p>

                        </div>

                    </div>


                    <!-- APPLICATION STATUS -->

                    <div class="col-md-6">

                        <div class="detail-item">

                            <label class="detail-label">
                                Application Status
                            </label>

                            <p
                                id="applicationStatus"
                                class="detail-value">
                            </p>

                        </div>

                    </div>


                    <!-- APPLICATION DATE -->

                    <div class="col-md-6">

                        <div class="detail-item">

                            <label class="detail-label">
                                Application Date
                            </label>

                            <p
                                id="applicationDate"
                                class="detail-value">
                            </p>

                        </div>

                    </div>


                    <!-- PURPOSE -->

                    <div class="col-md-6">

                        <div class="detail-item">

                            <label class="detail-label">
                                Purpose
                            </label>

                            <p
                                id="purpose"
                                class="detail-value">
                            </p>

                        </div>

                    </div>

                </div>


                <!-- ================= BUTTONS ================= -->

                <div class="mt-4 pt-3 border-top">

                    <button
                        type="button"
                        id="backButton"
                        class="btn btn-secondary">

                        Back to My Applications

                    </button>

                </div>


            </div>

        </div>

    </div>


</main>


<!-- ================= JAVASCRIPT ================= -->

<script src="../js/customer-loan-view.js"></script>

</body>

</html>
