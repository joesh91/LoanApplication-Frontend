<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>All Staff</title>

<!-- =====================================================
     BOOTSTRAP
     ===================================================== -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<!-- =====================================================
     OUR GLOBAL CSS
     ===================================================== -->

<link
    rel="stylesheet"
    href="../css/style.css"
>


</head>

<body>

<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-dark">

    <div class="container">

        <!-- SYSTEM NAME -->

        <a
            class="navbar-brand"
            href="dashboard.html"
        >
            Loan Management System
        </a>

        <!-- NAVIGATION BUTTONS -->

        <div>

            <a
                class="btn btn-outline-light me-2"
                id="dashboard"
            >
                Dashboard
            </a>

            <button
                type="button"
                class="btn btn-outline-light"
                id="logout"
            >
                Logout
            </button>

        </div>

    </div>

</nav>

<!-- =====================================================
     PAGE CONTENT
     ===================================================== -->

<main>

    <div class="container page-container py-5">

        <!-- =================================================
             PAGE HEADER
             ================================================= -->

        <div class="page-header">

            <div class="d-flex justify-content-between align-items-center">

                <div>

                    <h2>
                        All Staff
                    </h2>

                    <p>
                        View and manage staff members.
                    </p>

                </div>

                <a
                    class="btn btn-outline-primary"
                    href="staff-create.html"
                >
                    + Create New Staff
                </a>

            </div>

        </div>

        <!-- =================================================
             STAFF TABLE CARD
             ================================================= -->

        <div class="page-card">

            <!-- CARD HEADER -->

            <div class="card-header">

                <h5>
                    Staff Records
                </h5>

            </div>

            <!-- CARD BODY -->

            <div class="card-body">

                <!-- TABLE -->

                <div class="table-responsive">

                    <table class="table table-hover">

                        <thead>

                            <tr>

                                <th>Staff ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Position</th>

                            </tr>

                        </thead>

                        <!-- JavaScript will insert rows here -->

                        <tbody id="staffTable">
                        </tbody>

                    </table>

                </div>

                <!-- MESSAGE -->

                <div
                    id="staffMessage"
                    class="mt-3"
                >
                </div>

            </div>

        </div>

    </div>

</main>

<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="../js/staff.js"></script>


</body>

</html>
