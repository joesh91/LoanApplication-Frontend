<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width initial-scale=1.0">
<title>Loan Details</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>
	
<!-- PAGE CONTENT  -->

<div class="container mt-4">
	
		<h2 class="mb-4 text-format">
			Loan Details
		</h2>
		
		<div class="card shadow">
		
			<div class="card-body mt-3">
					
				<p>
					<strong>Loan ID : </strong>
					<span id="loanId"></span>
				</p>
				<p>
					<strong>Application ID : </strong>
					<span id="applicationId"></span>
				</p>
				<p>
					<strong>Approved Amount : </strong>
					<span id="appAmount"></span>
				</p>
				<p>
					<strong>Interest Rate : </strong>
					<span id="intRate"></span>
				</p>
				<p>
					<strong>Duration : </strong>
					<span id="duration"></span>
				</p>
				<p>
					<strong>Start Date : </strong>
					<span id="startDate"></span>
				</p>
				<p>
					<strong>End Date : </strong>
					<span id="endDate"></span>
				</p>
				<p>
					<strong>Status : </strong>
					<span id="status"></span>
				</p>
				
				<hr>
				<div class="container mt-3 mb-3">
					
					<button type="button" class="btn btn-primary" id="editLoanButton">
					Update / Verify Loan
					</button>
				
				</div>
				<div id="loanMessage" class="mt-3">
					
				</div>
				
			</div>
			
		</div>
		
</div>

<script src="../js/loan-details.js"></script>
</body>
</html>
