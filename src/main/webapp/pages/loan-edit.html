<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width initial-scale=1.0">
<title>Edit Loan</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
</head>
<body>

	<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>
	<div class="container mt-4">
	
		<h2 class="mb-4"> Update / Verify Loan</h2>
	
		<div class="card shadow">
		
			<div class="card-body">
			
				<form id=loanForm>
				
				 <!-- Loan ID -->
					<div class="mb-3">
					
						<label for="loanId" class="form-label" >
							Loan ID
						</label>
						
						<input type="text" id="loanId" class="form-control" readonly/>
					
					</div>
					
					<!-- Application ID -->
					
					<div class="mb-3">
					
						<label for="applicationId" class="form-label" >
							Application ID
						</label>
						
						<input type="text" id="applicationId" class="form-control" readonly/>
					
					</div>
										
					<!-- Approved Amount -->
					
					<div class="mb-3">
					
						<label for="approvedAmount" class="form-label" >
							Approved Amount ( LKR )
						</label>
						
						<input type="number" id="approvedAmount" class="form-control" />
					
					</div>
										
					<!-- Interest Rate -->
					
					<div class="mb-3">
					
						<label for="interestRate" class="form-label" >
							Interest Rate %
						</label>
						
						<input type="text" id="interestRate" class="form-control" />
					
					</div>
										
					<!-- Duration -->
					
					<div class="mb-3">
					
						<label for="duration" class="form-label" >
							Duration ( Month )
						</label>
						
						<input type="number" id="duration" class="form-control" />
					
					</div>
										
					<!-- Start Date -->
					
					<div class="mb-3">
					
						<label for="startDate" class="form-label" >
							Start Date
						</label>
						
						<input type="Date" id="startDate" class="form-control" readonly/>
					
					</div>
															
					<!-- End Date -->
					
					<div class="mb-3">
					
						<label for="endDate" class="form-label" >
							End Date
						</label>
						
						<input type="Date" id="endDate" class="form-control" />
					
					</div>
															
					<!-- Status -->
					
					<div class="mb-3">
					
						<label for="status" class="form-label" >
							Status
						</label>
						
						<select class="form-select" id="status">
							<option value="PENDING">PENDING</option>
                            <option value="APPROVED">APPROVED</option>
                            <option value="REJECTED">REJECTED</option>
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="COMPLETED">COMPLETED</option>
						</select>
					
					</div>
				
					<div class="mt-4">
					
						<button type="button" class="btn btn-primary" id="updateLoanBtn">
							Update Loan
						</button>
						
						<button type="button" class="btn btn-secondary ms-2" id="cancelBtn" >
							Cancel
						</button>
					</div>
				
				</form>
				
				<div id="loanMessage" class="mt-4">
					
				</div>
			
			</div>
		
		</div>
	
	</div>
		
		<Script src="../js/loan-edit.js"></Script>

</body>
</html>
