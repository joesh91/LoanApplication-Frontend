<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Loan</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Global Custom CSS -->
<link rel="stylesheet" href="../css/style.css">


</head>

<body>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-dark ">

    <div class="container">

        <a class="navbar-brand" href="dashboard.html">
            Loan Management System
        </a>

        <div>

            <a
                class="btn btn-outline-light me-2"
                id="dashboard">

                Dashboard

            </a>

            <button
                type="button"
                class="btn btn-outline-light"
                id="logout">

                Logout

            </button>

        </div>

    </div>

</nav>


<!-- =====================================================
     PAGE CONTENT
     ===================================================== -->

<main>

    <div class="container page-container py-5">

        <!-- PAGE HEADER -->

        <div class="page-header">

            <h2>Update / Verify Loan</h2>

            <p>
                Update or verify the information of the selected loan.
            </p>

        </div>


        <!-- =================================================
             LOAN FORM
             ================================================= -->

        <div class="page-card">

            <div class="card-header">

                <h5>Loan Information</h5>

            </div>


            <div class="card-body">

                <form id="loanForm">

                    <div class="row g-4">

                        <!-- LOAN ID -->

                        <div class="col-md-6">

                            <label
                                for="loanId"
                                class="form-label fw-semibold">

                                Loan ID

                            </label>

                            <input
                                type="text"
                                id="loanId"
                                class="form-control"
                                readonly>

                        </div>


                        <!-- APPLICATION ID -->

                        <div class="col-md-6">

                            <label
                                for="applicationId"
                                class="form-label fw-semibold">

                                Application ID

                            </label>

                            <input
                                type="text"
                                id="applicationId"
                                class="form-control"
                                readonly>

                        </div>


                        <!-- APPROVED AMOUNT -->

                        <div class="col-md-6">

                            <label
                                for="approvedAmount"
                                class="form-label fw-semibold">

                                Approved Amount (LKR)

                            </label>

                            <input
                                type="number"
                                id="approvedAmount"
                                class="form-control">

                        </div>


                        <!-- INTEREST RATE -->

                        <div class="col-md-6">

                            <label
                                for="interestRate"
                                class="form-label fw-semibold">

                                Interest Rate %

                            </label>

                            <input
                                type="text"
                                id="interestRate"
                                class="form-control">

                        </div>


                        <!-- DURATION -->

                        <div class="col-md-6">

                            <label
                                for="duration"
                                class="form-label fw-semibold">

                                Duration (Months)

                            </label>

                            <input
                                type="number"
                                id="duration"
                                class="form-control">

                        </div>


                        <!-- START DATE -->

                        <div class="col-md-6">

                            <label
                                for="startDate"
                                class="form-label fw-semibold">

                                Start Date

                            </label>

                            <input
                                type="date"
                                id="startDate"
                                class="form-control"
                                readonly>

                        </div>


                        <!-- END DATE -->

                        <div class="col-md-6">

                            <label
                                for="endDate"
                                class="form-label fw-semibold">

                                End Date

                            </label>

                            <input
                                type="date"
                                id="endDate"
                                class="form-control">

                        </div>


                        <!-- STATUS -->

                        <div class="col-md-6">

                            <label
                                for="status"
                                class="form-label fw-semibold">

                                Status

                            </label>

                            <select
                                class="form-select"
                                id="status">

                                <option value="PENDING">
                                    PENDING
                                </option>

                                <option value="APPROVED">
                                    APPROVED
                                </option>

                                <option value="REJECTED">
                                    REJECTED
                                </option>

                                <option value="ACTIVE">
                                    ACTIVE
                                </option>

                                <option value="COMPLETED">
                                    COMPLETED
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- =================================================
                         ACTION BUTTONS
                         ================================================= -->

                    <div class="d-flex flex-wrap gap-2 mt-4">

                        <button
                            type="button"
                            class="btn btn-primary"
                            id="updateLoanBtn">

                            Update Loan

                        </button>


                        <button
                            type="button"
                            class="btn btn-secondary"
                            id="cancelBtn">

                            Cancel

                        </button>

                    </div>

                </form>


                <!-- MESSAGE -->

                <div
                    id="loanMessage"
                    class="mt-4">

                </div>

            </div>

        </div>

    </div>

</main>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="../js/loan-edit.js"></script>


</body>

</html>
