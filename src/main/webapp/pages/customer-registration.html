<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Registration</title>



    <!-- =====================================================
         BOOTSTRAP
         ===================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >



    <!-- =====================================================
         OUR GLOBAL CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>



<body>



    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <nav class="navbar navbar-dark ">

        <div class="container">

            <!-- SYSTEM NAME -->

            <a
                class="navbar-brand"
                href="dashboard.html"
            >
                Loan Management System
            </a>



            <!-- NAVIGATION BUTTONS -->

            <div>

                <a
                    class="btn btn-outline-light me-2"
                    id="dashboard"
                >
                    Dashboard
                </a>


                <button
                    type="button"
                    class="btn btn-outline-light"
                    id="logout"
                >
                    Logout
                </button>

            </div>

        </div>

    </nav>





    <!-- =====================================================
         PAGE CONTENT
         ===================================================== -->

    <main>

        <div class="container page-container py-5">



            <!-- =================================================
                 PAGE HEADER
                 ================================================= -->

            <div class="page-header">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <h2>
                            Customer Registration
                        </h2>

                        <p>
                            View and manage customer registration requests.
                        </p>

                    </div>


                    <button
                        type="button"
                        class="btn btn-outline-primary"
                        id="createNewCustomer"
                    >
                        + Create New Customer Registration
                    </button>

                </div>

            </div>





            <!-- =================================================
                 REGISTRATION TABLE CARD
                 ================================================= -->

            <div class="page-card">



                <!-- CARD HEADER -->

                <div class="card-header">

                    <h5>
                        Customer Registration Requests
                    </h5>

                </div>



                <!-- CARD BODY -->

                <div class="card-body">



                    <!-- TABLE -->

                    <div class="table-responsive">

                        <table class="table table-hover">

                            <thead>

                                <tr>

                                    <th>
                                        Registration ID
                                    </th>

                                    <th>
                                        First Name
                                    </th>

                                    <th>
                                        Last Name
                                    </th>

                                    <th>
                                        NIC
                                    </th>

                                    <th>
                                        Phone
                                    </th>

                                    <th>
                                        Email
                                    </th>

                                    <th>
                                        Address
                                    </th>

                                    <th>
                                        Status
                                    </th>

                                </tr>

                            </thead>



                            <!-- JavaScript will insert rows here -->

                            <tbody id="customerRegistrationTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>



        </div>

    </main>





    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="../js/customer-registration.js"></script>



</body>

</html>
