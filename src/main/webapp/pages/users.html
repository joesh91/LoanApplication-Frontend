<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>
<body>

	<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>
	
	<!-- PAGE CONTENT -->
	
	<div class="container mt-5">
	
		<div class="d-flex justify-content-between align-items-center mb-4">
		
		<div>
			<h2 >
				User Management
			</h2>
			<p class="text-muted">
				View all system users
			</p>
		</div>
		
		<a  class="btn btn-outline-primary" id="userCreateButton">
			+ Create User
		</a>
		
		</div>
		
		<!-- User Table -->
		
		<div class="card shadow">
			
			<div class="card-body">
			
				<div class="table responsive">
				
					<table class="table table-bordered table-hover align-middle">
					
						<thead class="table-dark">
							
							<tr>
							
								<th> User ID</th>
								<th> Username</th>
								<th> Role</th>
								<th> Customer ID</th>
							
							</tr>
						
						</thead>
						
						<tbody id="userTable">
						
						</tbody>
					
					</table>
				
				</div>
			
			<!-- Message -->
        <div id="userMessage" class="mt-3"></div>
			
			</div>
		
		</div>
		
	</div>
	
  <script src="../js/users.js"></script>

</body>
</html>
