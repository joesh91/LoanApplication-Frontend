<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Staff</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Global Custom CSS -->
<link rel="stylesheet" href="../css/style.css">


</head>

<body>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="dashboard.html">
            Loan Management System
        </a>

        <div>

            <a
                class="btn btn-outline-light me-2"
                id="dashboard">

                Dashboard

            </a>

            <button
                type="button"
                class="btn btn-outline-light"
                id="logout">

                Logout

            </button>

        </div>

    </div>

</nav>


<!-- =====================================================
     PAGE CONTENT
     ===================================================== -->

<main>

    <div class="container page-container py-5">

        <!-- PAGE HEADER -->

        <div class="page-header">

            <h2>Edit Staff</h2>

            <p>
                Update the information of the selected staff member.
            </p>

        </div>


        <!-- =================================================
             STAFF FORM
             ================================================= -->

        <div class="page-card">

            <div class="card-header">

                <h5>Staff Information</h5>

            </div>


            <div class="card-body">

                <form id="staffForm">

                    <div class="row g-4">

                        <!-- STAFF ID -->

                        <div class="col-md-6">

                            <label
                                for="staffId"
                                class="form-label fw-semibold">

                                Staff ID

                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="staffId"
                                readonly
                                required>

                        </div>


                        <!-- NAME -->

                        <div class="col-md-6">

                            <label
                                for="name"
                                class="form-label fw-semibold">

                                Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                required>

                        </div>


                        <!-- EMAIL -->

                        <div class="col-md-6">

                            <label
                                for="email"
                                class="form-label fw-semibold">

                                Email

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                required>

                        </div>


                        <!-- POSITION -->

                        <div class="col-md-6">

                            <label
                                for="position"
                                class="form-label fw-semibold">

                                Position

                            </label>

                            <select
                                class="form-select"
                                id="position"
                                required>

                                <option value="Trainee">
                                    Trainee
                                </option>

                                <option value="JuniorExecutiveI">
                                    Junior Executive I
                                </option>

                                <option value="JuniorExecutiveII">
                                    Junior Executive II
                                </option>

                                <option value="ExecutiveI">
                                    Executive I
                                </option>

                                <option value="ExecutiveII">
                                    Executive II
                                </option>

                                <option value="SeniorExecutiveI">
                                    Senior Executive I
                                </option>

                                <option value="SeniorExecutiveII">
                                    Senior Executive II
                                </option>

                                <option value="Manager">
                                    Manager
                                </option>

                                <option value="SeniorManager">
                                    Senior Manager
                                </option>

                                <option value="RegionalManager">
                                    Regional Manager
                                </option>

                                <option value="ChiefManager">
                                    Chief Manager
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- =================================================
                         ACTION BUTTONS
                         ================================================= -->

                    <div class="d-flex flex-wrap gap-2 mt-4">

                        <button
                            type="button"
                            class="btn btn-primary"
                            id="updateStaffButton">

                            Update Staff

                        </button>


                        <button
                            type="button"
                            class="btn btn-secondary"
                            id="cancelButton">

                            Cancel

                        </button>

                    </div>

                </form>


                <!-- MESSAGE -->

                <div
                    id="staffMessage"
                    class="mt-4">

                </div>

            </div>

        </div>

    </div>

</main>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="../js/staff-edit.js"></script>


</body>

</html>
