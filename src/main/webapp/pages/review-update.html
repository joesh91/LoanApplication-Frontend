
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Application Details</title>


<!-- =====================================================
	         BOOTSTRAP
	         ===================================================== -->

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">


<!-- =====================================================
	         OUR GLOBAL CSS
	         ===================================================== -->

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


	<!-- =====================================================
	         NAVBAR
	         ===================================================== -->

	<nav class="navbar navbar-dark ">

		<div class="container">

			<!-- SYSTEM NAME -->

			<a class="navbar-brand" href="dashboard.html">
				Loan Management System </a>


			<!-- NAVIGATION -->

			<div>

				<a class="btn btn-outline-light me-2" id="dashboard">
					Dashboard </a>


				<button type="button" class="btn btn-outline-light" id="logout">
					Logout</button>

			</div>

		</div>

	</nav>


	<!-- ================= PAGE CONTAINER ================= -->

	<div class="container page-container py-5">

		<!-- PAGE HEADER -->

		<div class="page-header">

			<h2>Update Application Review</h2>

			<p>Update the review decision and comments for this loan
				application.</p>

		</div>


		<!-- ================= REVIEW CARD ================= -->

		<div class="card page-card">

			<div class="card-header">
				<h5 class="mb-0">Review Information</h5>
			</div>


			<div class="card-body">

				<form id="reviewUpdateForm">


					<!-- Review ID -->

					<div class="row mb-3">

						<div class="col-md-6">

							<label class="form-label"> Review ID </label> <input type="text"
								class="form-control" id="reviewId" readonly>

						</div>


						<div class="col-md-6">

							<label class="form-label"> Loan Application ID </label> <input
								type="text" class="form-control" id="applicationId" readonly>

						</div>

					</div>

					<!--  STAFF ID  -->

					<div class="mb-3">

						<label for="staffId" class="form-label"> Staff ID </label>

					<input type="text"
								class="form-control" id="staffId" readonly>

					</div>


					<!-- Decision -->

					<div class="mb-3">

						<label for="decision" class="form-label"> Review Decision

						</label> <select class="form-select" id="decision" required>

							<option value="">Select Decision</option>

							<option value="APPROVED">Approved</option>

							<option value="REJECTED">Rejected</option>

							<option value="PENDING">Pending</option>

						</select>

					</div>


					<!-- Comments -->

					<div class="mb-3">

						<label for="comments" class="form-label"> Comments </label>

						<textarea class="form-control" id="comments" rows="5"
							maxlength="500" placeholder="Enter review comments..." required></textarea>

						<div class="form-text">Maximum 500 characters.</div>

					</div>


					<!-- Buttons -->

					<div class="d-flex gap-2">

						<button type="button" class="btn btn-primary" id="updateButton">

							Update Review</button>

						<button type="button" class="btn btn-secondary"
							onclick="history.back()">Cancel</button>

					</div>


				</form>

			</div>

		</div>

	</div>


	<!-- ================= BOOTSTRAP JS ================= -->

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

	<!-- ================= PAGE JS ================= -->

	<script src="../js/review-update.js"></script>

</body>

</html>
