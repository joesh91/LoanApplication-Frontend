<!DOCTYPE html>
<html>
<head>

<title>OTP Verification - Loan Management System</title>

	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet" />
</head>
<body>

<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>


	<!-- ONE  -->
	<div class="container">

		<!-- TWO  -->
		<div class="row justify-content-center">

			<!-- THREE  -->
			<div class="col-md-6">

				<h1 class="text-center mt-5">Loan Management System</h1>

				<div class="card mt-4">

					<div class="card-body">

						<h2 class="text-center mb-4">OTP Verification</h2>

						<p class="text-center">Enter the OTP sent your registered
							email / mobile phone</p>

						<div id="message"></div>

						<form id="otpform">

							<div class="mb-3">

								<label for="otp" class="form-label text-center"> OTP </label> <input
									type="text" id="otp" name="otp" placeholder="Enter OTP"
									class="form-control" />

							</div>

							<div class="d-grid">

								<button type="submit" class="btn btn-primary">Verify
									OTP</button>

							</div>

						</form>

					</div>

				</div>

			</div>

		</div>

	</div>


	<script src="../js/auth.js"></script>
