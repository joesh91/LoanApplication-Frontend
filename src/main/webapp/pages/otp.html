<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>OTP Verification - Loan Management System</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Global Custom CSS -->
<link
    rel="stylesheet"
    href="../css/style.css">


</head>

<body>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-dark " >

    <div class="container">

        <a
            class="navbar-brand"
            href="#">

            Loan Management System

        </a>

    </div>

</nav>


<!-- =====================================================
     OTP VERIFICATION
     ===================================================== -->

<main>

    <div class="container page-container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6 col-xl-5">


                <!-- PAGE HEADER -->

                <div class="page-header text-center">

                    <h2>
                        Loan Management System
                    </h2>

                    <p>
                        Verify your identity to continue.
                    </p>

                </div>


                <!-- OTP CARD -->

                <div class="page-card">

                    <div class="card-header">

                        <h5>
                            OTP Verification
                        </h5>

                    </div>


                    <div class="card-body">

                        <p class="text-muted text-center mb-4">

                            Enter the OTP sent to your registered
                            email or mobile phone.

                        </p>


                        <!-- MESSAGE -->

                        <div
                            id="message"
                            class="mb-3">

                        </div>


                        <!-- OTP FORM -->

                        <form id="otpform">

                            <!-- OTP -->

                            <div class="mb-4">

                                <label
                                    for="otp"
                                    class="form-label fw-semibold">

                                    OTP

                                </label>

                                <input
                                    type="text"
                                    id="otp"
                                    name="otp"
                                    placeholder="Enter OTP"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- VERIFY BUTTON -->

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary">

                                    Verify OTP

                                </button>

                            </div>

                        </form>

                    </div>

                </div>


                <!-- INFORMATION -->

                <div class="text-center mt-4">

                    <p class="text-muted mb-0">

                        Please enter the verification code
                        sent to your registered contact.

                    </p>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="../js/auth.js"></script>


</body>

</html>
