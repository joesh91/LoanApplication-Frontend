<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Details</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>
<body>

	<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>
	
	<!-- MAIN CONTENT -->
	 <div class="container mt-4">
	 
	 <div class="card shadow">
	 
	 	<div class="card-header mt-1 mb-" >
	 		<h4 class="mb-0">User Details</h4>	 	
	 	</div>
	 	
	 	<div class="card-body">
	 	
	 		<div class="mt-3 mb-3">
	 			<strong>User ID : </strong>
	 			<span id="userId"></span>
	 		</div>
	 		
	 		<div class="mb-3">
	 			<strong>Username : </strong>
	 			<span id="userName"></span>
	 		</div>
	 			 			 		
	 		<div class="mb-3">
	 			<strong>Role : </strong>
	 			<span id="role"></span>
	 		</div>
	 		
	 		<div class="mb-3">
	 			<strong>Customer ID : </strong>
	 			<span id="customerId"></span>
	 		</div>
	 		
	 		<div id="userMessage" class="mt-3"></div>
	 		
	 		<div>
	 			
	 			<button type="button" class="btn btn-primary" id="editUserButton">
	 				Edit User
	 			</button>
	 			
	 			<button type="button" class="btn btn-secondary ms-2" id="backButton">
	 				Back
	 			</button>
	 		
	 		</div>	 		
	 	
	 	</div>
	 
	 </div>
	
	</div>
  <script src="../js/user-details.js"></script>
