<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Customer</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">


</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark fixed-top">

    <div class="container">

        <a class="navbar-brand" href="dashboard.html">
            Loan Management System
        </a>

        <div>

            <a class="btn btn-outline-light me-2" id="dashboard">
                Dashboard
            </a>

            <button type="button" class="btn btn-outline-light" id="logout">
                Logout
            </button>

        </div>

    </div>

</nav>


<!-- PAGE CONTENT -->
<main>

    <div class="container page-container py-5">

        <!-- PAGE HEADER -->
        <div class="page-header">

            <h2>Edit Customer</h2>

            <p>
                Update the information of the selected customer.
            </p>

        </div>


        <!-- CUSTOMER FORM -->
        <div class="page-card">

            <div class="card-header">

                <h5>Customer Information</h5>

            </div>


            <div class="card-body">

                <form id="editCustomerForm">

                    <div class="row g-4">

                        <!-- CUSTOMER ID -->
                        <div class="col-md-6">

                            <label for="customerID" class="form-label fw-semibold">
                                Customer ID
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="customerID"
                                disabled
                                readonly>

                        </div>


                        <!-- FIRST NAME -->
                        <div class="col-md-6">

                            <label for="firstName" class="form-label fw-semibold">
                                First Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="firstName"
                                required>

                        </div>


                        <!-- LAST NAME -->
                        <div class="col-md-6">

                            <label for="lastName" class="form-label fw-semibold">
                                Last Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="lastName"
                                required>

                        </div>


                        <!-- NIC -->
                        <div class="col-md-6">

                            <label for="nic" class="form-label fw-semibold">
                                NIC
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nic"
                                required>

                        </div>


                        <!-- PHONE -->
                        <div class="col-md-6">

                            <label for="phone" class="form-label fw-semibold">
                                Phone
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="phone"
                                required>

                        </div>


                        <!-- EMAIL -->
                        <div class="col-md-6">

                            <label for="email" class="form-label fw-semibold">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                required>

                        </div>


                        <!-- ADDRESS -->
                        <div class="col-12">

                            <label for="address" class="form-label fw-semibold">
                                Address
                            </label>

                            <textarea
                                class="form-control"
                                id="address"
                                rows="5"
                                required></textarea>

                        </div>

                    </div>


                    <!-- BUTTONS -->
                    <div class="d-flex flex-wrap gap-2 mt-4">

                        <button
                            type="button"
                            class="btn btn-primary"
                            id="updateCustomerBtn">

                            Update Customer

                        </button>


                        <button
                            type="button"
                            class="btn btn-secondary"
                            id="cancelBtn">

                            Cancel

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</main>


<script src="../js/customer-edit.js"></script>


</body>

</html>
