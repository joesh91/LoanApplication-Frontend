<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width initial-scale=1.0">
<title>Edit Customer</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>

<!-- PAGE CONTENT -->

<div class="container mt-4">

	<div>
		<h2 class="mb-4">
			Edit Customer
		</h2>
	</div>
	
	<div class="card shadow">
	
		<div class="card-body">
		
			<form id="editCustomerForm">
			
			<!--  CUSTOMER ID -->
			
				<div class="mb-3">
					
					<label for="customerID" class="form-label">
						Custoemr ID 
					</label>
					
					<input type="text" class="form-control text-muted" id="customerID" disabled readonly/>
					
				</div>
				
				  <!-- FIRST NAME -->
				  
				<div class="mb-3">
					
					<label for="firstName" class="form-label">
						First name
					</label>
					
					<input type="text" class="form-control" id="firstName" required/>
					
				</div>
				
				  <!-- LAST NAME -->
				  
				 <div class="mb-3">
				 
				 	<label for="lastName" class="form-label"> 
				 		Last Name
				 	</label>
				 	
				 	<input type="text" class="form-control" id="lastName" required />
				 	
				 </div> 
				 
				 <!-- NIC -->
				 
				 <div class="mb-3">
				 
				 	<label for="nic" class="form-label">
				 		NIC
				 	</label>
				 	
				 	<input type="text" class="form-control" id="nic"  required/>
				 	
				 </div>
				 
				  <!-- PHONE -->
				  
				  <div class="mb-3">
				  
				  	<label for="phone" class="form-label">
				  		Phone
				  	</label>
				  	
				  	<input type="text" class="form-control" id="phone" required/>
				  
				  </div>
				  
				  <!-- EMAIL -->
				  
				  <div class="mb-3"> 
				  
				  	<label for="email" class="form-label">
				  		Email
				  	</label>
				  	
				  	<input type="email" class="form-control" id="email"  required/>
				  
				  </div>
			
			 <!-- ADDRESS -->
				  
				  <div class="mb-3">
				  
				  	<label for="address" class="form-label">
				  		Address
				  	</label>
				  	
				  	<textarea class="form-control" id="address" rows="5"  required></textarea>
				  
				  </div>
				  
				     <!-- BUTTONS -->
				     
				  <div class="mt-4">
				  
				  	<button type="button" class="btn btn-primary" id="updateCustomerBtn">
				  		Update Customer
				  	</button>
				  	
					<button type="button" class="btn btn-secondary" id="cancelBtn">
				  		Cancel
				  	</button>
				  	
				  </div>
			
			</form>
		
		</div>
	
	</div>


</div>

<script src="../js/customer-edit.js"></script>
</body>
</html>
