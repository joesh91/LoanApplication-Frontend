<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width ,initial-scale=1.0" />
<title>Loan Application Details</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
	<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>

	<div class="container mt-5">

		<h1>Loan Application Details</h1>

		<div class="card mt-4">

			<div class="card-body">

				<p>
					<Strong> Application ID :</Strong><span id="applicationId"></span>
				</p>

				<p>
					<Strong> Loan Type : </Strong><span id="loanType"></span>
				</p>

				<p>
					<strong>Requested Amount:</strong> <span id="requestedAmount"></span>
				</p>

				<p>
					<strong>Purpose:</strong> <span id="purpose"></span>
				</p>

				<p>
					<strong>Status:</strong> <span id="status"></span>
				</p>

				<p>
					<strong>Customer ID:</strong> <span id="customerid"></span>
				</p>

				<p>
					<strong>Application Date:</strong> <span id="appDate"></span>
				</p>

			</div>
			<!-- DOCUMENTS -->

		<div class="card mt-4">

			<div class="card-header">

				<h4>Submitted Documents</h4>

			</div>

		</div>

		<div class="card-body">

			<div id="documentsContainer">

				<p>Loading documents...</p>

			</div>

		</div>
			
				
			<button type="button" class="btn btn-primary" id="reviewApplication"> Review Application ( Approve / Reject )</button>
		</div>
		


	</div>
	
	<script src="../js/loan-application-details.js"></script>
</body>
</html>
