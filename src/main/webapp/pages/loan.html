<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width initial-scale=1.0">
<title>Loans</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>

<!--  MAIN CONTENT  -->

<div class="container mt-4">

			<div class="d-flex justify-content-between align-items mb-4">

				<h2 >
				All Loans
				</h2>
	
			<button type="button" class="btn btn-outline-primary" id="createNewLoan">
				+ Create New Loan
			</button>
			
			</div>
	
	<div class="card shadow">
	
		<div class="card-body">
		
		<div class="table-responsive">
		
			<table class="table table-bordered table-hover">
			
				<thead class="table-dark"> 
				
					<tr>
					
						<th> Loan ID </th>
						<th> Application ID </th>
						<th> Amount </th>
						<th> Interest Rate </th>
						<th> Duration </th>
						<th> Start Date </th>
						<th> End Date </th>
						<th> Status </th>
						
					
					</tr>
				
				</thead>
				
				<tbody id="loanTable">
				
				</tbody>
			
			</table>
			
			</div>
		</div>
	
	</div>

</div>

<script src="../js/loan.js"></script>

</body>
</html>
