<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width initial-scale=1.0">
<title>Payment Details</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
</head>
<body>
	
<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>

<div class="container mt-4">

	<h5 class="mb-4">Payment Details</h5>
	
	<div class="card shadow mt-4">
		
		<div class="card-body">
			
			<p> 
				<strong> Payment ID : </strong>
				<span id="paymentId"></span>
			</p>
			
			<p> 
				<strong> Loan ID : </strong>
				<span id="loanId"></span>
			</p>
			
			<p> 
				<strong> Amount : </strong>
				<span id="amount"></span>
			</p>
		
			<p> 
				<strong> Payment Date : </strong>
				<span id="paymentDate"></span>
			</p>
			<p> 
				<strong> Status : </strong>
				<span id="status"></span>
			</p>
		
		
		</div>
			
	</div>
	
	<div class="mt-3">
		
		<button type="button" class="btn btn-primary" id="editPayment"> 
			Edit Payment
		</button>
	
	</div>

</div>

<!-- JAVASCRIPT -->

<script src="../js/payment-details.js"></script>

</body>
</html>
