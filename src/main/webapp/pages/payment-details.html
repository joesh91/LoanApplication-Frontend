<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Details</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <nav class="navbar navbar-dark ">

        <div class="container">

            <a
                class="navbar-brand"
                href="dashboard.html">

                Loan Management System

            </a>

            <div>

                <a
                    class="btn btn-outline-light me-2"
                    id="dashboard">

                    Dashboard

                </a>

                <button
                    type="button"
                    class="btn btn-outline-light"
                    id="logout">

                    Logout

                </button>

            </div>

        </div>

    </nav>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main>

        <div class="container page-container py-5">

            <!-- PAGE HEADER -->

            <div class="page-header">

                <h2>Payment Details</h2>

                <p>
                    View the details of the selected payment.
                </p>

            </div>


            <!-- =================================================
                 PAYMENT INFORMATION
                 ================================================= -->

            <div class="page-card mb-4">

                <div class="card-header">

                    <h5>Payment Information</h5>

                </div>


                <div class="card-body">

                    <div class="row g-4">

                        <!-- Payment ID -->

                        <div class="col-md-6">

                            <div class="fw-semibold text-muted mb-1">
                                Payment ID
                            </div>

                            <div id="paymentId">
                            </div>

                        </div>


                        <!-- Loan ID -->

                        <div class="col-md-6">

                            <div class="fw-semibold text-muted mb-1">
                                Loan ID
                            </div>

                            <div id="loanId">
                            </div>

                        </div>


                        <!-- Amount -->

                        <div class="col-md-6">

                            <div class="fw-semibold text-muted mb-1">
                                Amount
                            </div>

                            <div id="amount">
                            </div>

                        </div>


                        <!-- Payment Date -->

                        <div class="col-md-6">

                            <div class="fw-semibold text-muted mb-1">
                                Payment Date
                            </div>

                            <div id="paymentDate">
                            </div>

                        </div>


                        <!-- Status -->

                        <div class="col-md-6">

                            <div class="fw-semibold text-muted mb-1">
                                Status
                            </div>

                            <div id="status">
                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 PAYMENT ACTIONS
                 ================================================= -->

            <div class="page-card">

                <div class="card-header">

                    <h5>Payment Actions</h5>

                </div>


                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                        <div>

                            <h6 class="mb-1">
                                Manage Payment
                            </h6>

                            <p class="text-muted mb-0">
                                Edit the selected payment or return to the payment list.
                            </p>

                        </div>


                        <div>

                            <button
                                type="button"
                                class="btn btn-primary"
                                id="editPayment">

                                Edit Payment

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="../js/payment-details.js"></script>

</body>

</html>
