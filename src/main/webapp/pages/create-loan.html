<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width initial-scale=1.0">
<title>Create New Loan</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
</head>
<body>
	
	<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	
	</nav>
	
	<!--  PAGE CONTENT -->
	
	<div class="container mt-4">
	
		<h2 class="mb-4">
			Create New Loan
		</h2>
		
		<div class="card shadow">
		
			<div class="card-body">
			
				<form id="loanform">
				
					 			<!-- Application ID -->
					 	<div class="mb-3">
					 	
					 		<label for="applicationId" class="form-label">
					 			Application ID
					 		</label>
					 		
					 		<input type="text" class="form-control" id="applicationId" required />
					 	
					 	</div>
				
									 <!-- Approved Amount -->
					 	<div class="mb-3">
					 	
					 		<label for="appAmount" class="form-label">
					 			Approved Amount ( LKR )
					 		</label>
					 		
					 		<input type="number" class="form-control" id="appAmount" step="0.01" min="0.01" required />
					 	
					 	</div>
					 					 					
									<!-- Interest Rate -->
					 	<div class="mb-3">
					 	
					 		<label for="intRate" class="form-label">
					 			Interest Rate ( % )
					 		</label>
					 		
					 		<input type="number" class="form-control" id="intRate" min="1" required />
					 	
					 	</div>
					 	
					 				<!-- Duration -->
					 	<div class="mb-3">
					 	
					 		<label for="duration" class="form-label">
					 			Duration ( Months )
					 		</label>
					 		
					 		<input type="number" class="form-control" id="duration" min="1" required />
					 	
					 	</div>
					 	
					 			<!-- Start Date -->
					 	<div class="mb-3">
					 	
					 		<label for="startDate" class="form-label">
					 			Start Date
					 		</label>
					 		
					 		<input type="Date" class="form-control" id="startDate" readonly required />
					 	
					 	</div>
					 	
					 			<!-- End Date -->
					 	<div class="mb-3">
					 	
					 		<label for="endDate" class="form-label">
					 			End Date
					 		</label>
					 		
					 		<input type="Date" class="form-control" id="endDate"  required />
					 	
					 	</div>
		
					 	
					 	<div class="mt-4">
					 		
					 		<button type="button" class="btn btn-primary" id="createLoanButton">
					 			Create Loan
					 		</button>
					 			
					 		<button type="button" class="btn btn-secondary  ms-1	" id="cancelButton">
					 			Cancel
					 		</button>					 	
					 	
					 	
					 	</div>

				</form>
				<div id="loanMessage">
					TEST MESSAGE
				</div>
			
			</div>
			
		</div>
	
	</div>
<script src="../js/create-loan.js"></script>
</body>
</html>
