
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create New Loan</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <nav class="navbar navbar-dark ">

        <div class="container">

            <a class="navbar-brand" href="dashboard.html">
                Loan Management System
            </a>

            <div>

                <a
                    class="btn btn-outline-light me-2"
                    id="dashboard">

                    Dashboard

                </a>

                <button
                    type="button"
                    class="btn btn-outline-light"
                    id="logout">

                    Logout

                </button>

            </div>

        </div>

    </nav>


    <!-- =====================================================
         PAGE CONTENT
         ===================================================== -->

    <main>

        <div class="container page-container py-5">

            <!-- PAGE HEADER -->

            <div class="page-header">

                <h2>Create New Loan</h2>

                <p>
                    Create a new loan record for an approved loan application.
                </p>

            </div>


            <!-- =================================================
                 LOAN FORM
                 ================================================= -->

            <div class="page-card">

                <div class="card-header">

                    <h5>Loan Information</h5>

                </div>


                <div class="card-body">

                    <form id="loanform">

                        <div class="row g-4">

                            <!-- Application ID -->

                            <div class="col-md-6">

                                <label
                                    for="applicationId"
                                    class="form-label fw-semibold">

                                    Application ID

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="applicationId"
                                    required>

                            </div>


                            <!-- Approved Amount -->

                            <div class="col-md-6">

                                <label
                                    for="appAmount"
                                    class="form-label fw-semibold">

                                    Approved Amount (LKR)

                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="appAmount"
                                    step="0.01"
                                    min="0.01"
                                    required>

                            </div>


                            <!-- Interest Rate -->

                            <div class="col-md-6">

                                <label
                                    for="intRate"
                                    class="form-label fw-semibold">

                                    Interest Rate (%)

                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="intRate"
                                    min="1"
                                    required>

                            </div>


                            <!-- Duration -->

                            <div class="col-md-6">

                                <label
                                    for="duration"
                                    class="form-label fw-semibold">

                                    Duration (Months)

                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="duration"
                                    min="1"
                                    required>

                            </div>


                            <!-- Start Date -->

                            <div class="col-md-6">

                                <label
                                    for="startDate"
                                    class="form-label fw-semibold">

                                    Start Date

                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="startDate"
                                    readonly
                                    required>

                            </div>


                            <!-- End Date -->

                            <div class="col-md-6">

                                <label
                                    for="endDate"
                                    class="form-label fw-semibold">

                                    End Date

                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="endDate"
                                    required>

                            </div>

                        </div>


                        <!-- =================================================
                             ACTION BUTTONS
                             ================================================= -->

                        <div class="d-flex flex-wrap gap-2 mt-4">

                            <button
                                type="button"
                                class="btn btn-primary"
                                id="createLoanButton">

                                Create Loan

                            </button>

                            <button
                                type="button"
                                class="btn btn-secondary"
                                id="cancelButton">

                                Cancel

                            </button>

                        </div>

                    </form>


                    <!-- MESSAGE -->

                    <div
                        id="loanMessage"
                        class="mt-3">

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- JavaScript -->

    <script src="../js/create-loan.js"></script>

</body>

</html>
