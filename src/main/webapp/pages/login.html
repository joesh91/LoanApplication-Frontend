<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Loan Management System - Login</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Global Custom CSS -->
<link
    rel="stylesheet"
    href="../css/style.css">


</head>

<body>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-dark ">

    <div class="container">

        <a
            class="navbar-brand"
            href="#">

            Loan Management System

        </a>

    </div>

</nav>


<!-- =====================================================
     LOGIN PAGE
     ===================================================== -->

<main>

    <div class="container page-container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6 col-xl-5">


                <!-- PAGE HEADER -->

                <div class="page-header text-center">

                    <h2>
                        Loan Management System
                    </h2>

                    <p>
                        Sign in to access your account.
                    </p>

                </div>


                <!-- LOGIN CARD -->

                <div class="page-card">

                    <div class="card-header">

                        <h5>
                            Login
                        </h5>

                    </div>


                    <div class="card-body">

                        <!-- MESSAGE -->

                        <div
                            id="message"
                            class="mb-3">

                        </div>


                        <!-- LOGIN FORM -->

                        <form id="loginform">

                            <!-- USERNAME -->

                            <div class="mb-4">

                                <label
                                    for="username"
                                    class="form-label fw-semibold">

                                    Username

                                </label>

                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    placeholder="Enter your username"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- PASSWORD -->

                            <div class="mb-4">

                                <label
                                    for="password"
                                    class="form-label fw-semibold">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter your password"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- LOGIN BUTTON -->

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    id="login"
                                    class="btn btn-primary">

                                    Login

                                </button>

                            </div>

                        </form>

                    </div>

                </div>


                <!-- LOGIN INFORMATION -->

                <div class="text-center mt-4">

                    <p class="text-muted mb-0">
                        Secure access to the Loan Management System
                    </p>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="../js/auth.js"></script>

</body>

</html>
