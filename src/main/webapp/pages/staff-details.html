<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">


</head>

<body>


<!-- NAVBAR -->
<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="dashboard.html">
            Loan Management System
        </a>

        <div>

            <a class="btn btn-outline-light me-2" id="dashboard">
                Dashboard
            </a>

            <button type="button" class="btn btn-outline-light" id="logout">
                Logout
            </button>

        </div>

    </div>

</nav>


<!-- PAGE CONTENT -->
<main>

    <div class="container page-container py-5">

        <!-- PAGE HEADER -->
        <div class="page-header">

            <h2>Staff Details</h2>

            <p>
                View the details of the selected staff member.
            </p>

        </div>


        <!-- STAFF INFORMATION -->
        <div class="page-card mb-4">

            <div class="card-header">

                <h5>Staff Information</h5>

            </div>


            <div class="card-body">

                <div class="row g-4">

                    <div class="col-md-6">

                        <div class="fw-semibold text-muted mb-1">
                            Staff ID
                        </div>

                        <div id="staffId"></div>

                    </div>


                    <div class="col-md-6">

                        <div class="fw-semibold text-muted mb-1">
                            Name
                        </div>

                        <div id="name"></div>

                    </div>


                    <div class="col-md-6">

                        <div class="fw-semibold text-muted mb-1">
                            Email
                        </div>

                        <div id="email"></div>

                    </div>


                    <div class="col-md-6">

                        <div class="fw-semibold text-muted mb-1">
                            Position
                        </div>

                        <div id="position"></div>

                    </div>

                </div>

            </div>

        </div>


        <!-- STAFF ACTIONS -->
        <div class="page-card">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                    <div>

                        <h5 class="card-title mb-1">
                            Staff Actions
                        </h5>

                        <p class="card-text mb-0">
                            Edit the selected staff member or return to the staff list.
                        </p>

                    </div>


                    <div>

                        <button type="button"
                                class="btn btn-primary"
                                id="editStaffButton">

                            Edit Staff

                        </button>
                        
						<button type="button"
                                class="btn btn-danger ms-2"
                                id="deleteButton">

                            Delete

                        </button>

                        <button type="button"
                                class="btn btn-secondary ms-2"
                                id="cancelButton">

                            Cancel

                        </button>

                    </div>

                </div>


                <!-- MESSAGE AREA -->
                <div id="staffMessage" class="mt-3"></div>

            </div>

        </div>

    </div>

</main>


<script src="../js/staff-details.js"></script>


</body>

</html>
