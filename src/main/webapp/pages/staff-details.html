<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Details</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>
<body>

	<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>
	
	<!-- PAGE CONTENT -->
	
	<div class="container mt-4">
	
		<h2 class="mb-4">
			Staff Details
		</h2>
	
		<div class="card shadow">
		
			<div class="card-body">
			
				<div class="mb-3">
					<strong>Staff ID : </strong>
					<span id="staffId"></span>
				</div>
				
				<div class="mb-3">
					<strong>Name : </strong>
					<span id="name"></span>
				</div>
				
				<div class="mb-3">
					<strong>Email : </strong>
					<span id="email"></span>
				</div>
				
				<div class="mb-3">
					<strong>Position : </strong>
					<span id="position"></span>
				</div>
				
				<!-- BUTTONS -->
				
				<div>
					
					<button type="button" class="btn btn-primary" id="editStaffButton">
						Edit Staff
					</button>
				
					<button type="button" class="btn btn-secondary ms-1" id="cancelButton">
						Cancel
					</button>
				
				</div>
				
			
			</div>
			
		</div>
		
		 <div
            id="staffMessage"
            class="mt-3">
        </div>
	
	</div>

<script src="../js/staff-details.js"></script>
</body>
</html>
