<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width initial-scale=1.0">
<title>Loan Application Dashboard</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
</head>
<body>

	<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>
	
	
	<!-- MAIN CONTENT  -->
	
    	
	<div class="container mt-4">
	
	
	
		<h2 class="mb-4">
			Create New Staff
		</h2>
		
		<div class="card shadow">
		
			<div class="card-body">
			
				<form id="staffForm">
				
							<!-- STAFF ID -->
				
				<div class="mb-3">
					
					<label for="staffId" class="form-label">
						Staff ID
					</label>
					
					<input type="number" class="form-control" id="staffId" min="1" required />
					
				</div>
				
								<!-- NAME -->
				
				<div class="mb-3">
					
					<label for="name" class="form-label">
						Name
					</label>
					
					<input type="text" class="form-control" id="name"  required />
					
				</div>
				
												<!-- EMAIL -->
				
				<div class="mb-3">
					
					<label for="email" class="form-label">
						Email
					</label>
					
					<input type="email" class="form-control" id="email" required />
					
				</div>
				
				
												<!-- POSITION -->
				
				<div class="mb-3">
					
					<label for="position" class="form-label">
						Position
					</label>
					
					<!-- <input type="text" class="form-control" id="position" required />  -->
					
					<select class="form-select" id="position" required >
						<option value="Trainee"> Trainee</option>
						<option value="JuniorExecutiveI"> Junior Executive I</option>
						<option value="JuniorExecutiveII"> Junior Executive II</option>
						<option value="ExecutiveI"> Executive I</option>
						<option value="ExecutiveII"> Executive II</option>
						<option value="SeniorExecutiveI"> Senior Executive I</option>
						<option value="SeniorExecutiveII"> Senior Executive II</option>
						<option value="Manager"> Manager</option>
						<option value="SeniorManager"> Senior Manager</option>
						<option value="RegionalManager"> Regional Manager</option>
						<option value="ChiefManager"> Chief Manager</option>
					</select>
					
				</div>
				
												<!-- BUTTONS -->
				
				<div class="mt-4">
					
					<button type="button" class="btn btn-primary" id="createStaffBtn">
						Create Staff
					</button>
					
					<button type="button" class="btn btn-secondary ms-2" id="cancelBtn">
						Cancel
					</button>
					
				</div>
				
				</form>
				
				<!-- MESSAGE -->

                <div
                    id="staffMessage"
                    class="mt-3">
                </div>
			
			</div>
		
		</div>
		
	</div>

</body>
</html>
