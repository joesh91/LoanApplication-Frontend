<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Payment</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <nav class="navbar navbar-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="dashboard.html">

                Loan Management System

            </a>

            <div>

                <a
                    class="btn btn-outline-light me-2"
                    id="dashboard">

                    Dashboard

                </a>

                <button
                    type="button"
                    class="btn btn-outline-light"
                    id="logout">

                    Logout

                </button>

            </div>

        </div>

    </nav>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main>

        <div class="container page-container py-5">

            <!-- PAGE HEADER -->

            <div class="page-header">

                <h2>Edit Payment</h2>

                <p>
                    Update the information of the selected payment.
                </p>

            </div>


            <!-- =================================================
                 PAYMENT FORM
                 ================================================= -->

            <div class="page-card">

                <div class="card-header">

                    <h5>Payment Information</h5>

                </div>


                <div class="card-body">

                    <form id="paymentForm">

                        <div class="row g-4">

                            <!-- Payment ID -->

                            <div class="col-md-6">

                                <label
                                    for="paymentId"
                                    class="form-label fw-semibold">

                                    Payment ID

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="paymentId"
                                    readonly>

                            </div>


                            <!-- Loan ID -->

                            <div class="col-md-6">

                                <label
                                    for="loanId"
                                    class="form-label fw-semibold">

                                    Loan ID

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="loanId"
                                    readonly>

                            </div>


                            <!-- Amount -->

                            <div class="col-md-6">

                                <label
                                    for="amount"
                                    class="form-label fw-semibold">

                                    Amount

                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="amount"
                                    step="0.01"
                                    required>

                            </div>


                            <!-- Payment Date -->

                            <div class="col-md-6">

                                <label
                                    for="paymentDate"
                                    class="form-label fw-semibold">

                                    Payment Date

                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="paymentDate"
                                    readonly>

                            </div>


                            <!-- Payment Status -->

                            <div class="col-md-6">

                                <label
                                    for="status"
                                    class="form-label fw-semibold">

                                    Payment Status

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="status"
                                    required>

                            </div>

                        </div>


                        <!-- =================================================
                             ACTION BUTTONS
                             ================================================= -->

                        <div class="d-flex flex-wrap gap-2 mt-4">

                            <button
                                type="submit"
                                class="btn btn-primary"
                                id="updatePayment">

                                Update Payment

                            </button>

                            <button
                                type="button"
                                class="btn btn-secondary"
                                onclick="history.back()">

                                Cancel

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="../js/payment-edit.js"></script>

</body>

</html>
