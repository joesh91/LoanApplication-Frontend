<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width initial-scale=1.0">
<title>Edit Payment</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
</head>
<body>
	
<!-- NAV BAR -->	

<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>

<!-- MAIN CONTENT -->

<div class="container mt-4">
	
	<h5 class="mb-4">
		Edit Payment
	</h5>
	
	<div class="card shadow mt-4">
	
		<div class="card-body ">
			
			<form id="paymentForm">
				
				<div class="mb-3">
						
					<label class="form-label">
						Payment ID
					</label>
						
					<input type="text" class="form-control" id="paymentId" readonly/>
										
				</div>
				<div>
				
					<label class="form-label">
						Loan ID
					</label>
						
					<input type="text" class="form-control" id="loanId" readonly/>
										
				</div>
				<div>
				
					<label class="form-label">
						Amount
					</label>
						
					<input type="number" class="form-control" id="amount" step=0.01 required/>
										
				</div>
				<div>
				
					<label class="form-label">
						Payment Date
					</label>
						
					<input type="date" class="form-control" id="paymentDate"  readonly/>
										
				</div>
				<div>
				
					<label class="form-label">
						Payment Status
					</label>
						
					<input type="text" class="form-control" id="status"  required/>
					
					<!--
					<select id="status" class="form-control">
						<option value="pending"> Pending </option>
						<option value="paid"> Paid  </option>
						<option value="rejected"> Rejected </option>
					</select>
								-->		
				</div>
				
				<div class="mt-3">
				
					<button type="submit" class="btn btn-primary" id="updatePayment">
						Update
					</button>
					<!--
					<button type="button" class="btn btn-warning" id="clear">
						Clear
					</button>	
					-->	
				</div>
			
			</form>
			
		</div>
		
	</div>

</div>

<!-- JAVASCRIPT -->

<script src="../js/payment-edit.js"></script>

</body>
</html>
