<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

		<!--  NAV BAR -->

<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>
		<!-- MAIN CONTENT -->
		
	<div class="container mt-5">
			
		<div class="row justify-content-center ">
		
			<div class="col-md-7">
			
				<div class="card shadow">
					
					<div class="card-body">
					
						<h2 class="text-center mb-4">
							Upload Loan Documents
						</h2>
					
		<!-- FROM -->	
				
						<form id="uploadDocumentForm">
		
		<!-- DOCUMENT TYPE -->
							
							<div class="mb-3 mt-1">
								
								<label for="documentType" class="form-label" >
									Document Type
								</label>
								
								<select id="documentType" class="form-select" required>
									
									<option value="" selected> Select Document Type </option>
									<option value="nic" > NIC </option>
									<option value="salarySlip"> Salary Slip </option>
									<option value="bankStatement"> Bank Statement </option>
									<option value="other"> Other </option>
								</select>
								
							</div>
							
		<!-- DOCUMENT FILE -->			
				
							<div class="mb-3">
								
								<label class="form-label">
									File								
								</label>
							
								<input type="file"  id="documentFile" class="form-control" required />
							</div>
							
		<!-- UPLOAD BUTTON -->
		
							<div class="mb-3 d-grid">
								
								<button type="submit"
										id="uploadDocument" 
										class="btn btn-primary">
									Upload Documents
								</button>
								
							</div>					
							
						</form>
						
		<!--  MESSAGE -->
				
				<div id="message" class="mt-3 text-center">
						TEST MESSAGE
				</div>
					
					</div>
				
				</div>
			
			</div>
		
		</div>
		
	</div>	
<!-- java script -->

	<script src = "../js/upload-document.js"></script>

</body>
</html>
