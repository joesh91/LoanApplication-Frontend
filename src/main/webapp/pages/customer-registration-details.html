<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width initial-scale=1.0">
<title>Loan Application Dashboard</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
</head>
<body>

	<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>

	<!--  PAGE CONTENT  -->
	<div class="container mt-5">
	
		
		<h2 class="mb-3">Customer Registration Details</h2>
		
			<div class="card shadow">
				
				<div class="card-body">
					
					<p>
						<strong>Registration ID : </strong>
						<span id="registrationId"> </span>
					</p>
					
					<p>
						<strong>First Name : </strong>
						<span id="firstName"> </span>
					</p>
					
					<p>
						<strong>Last Name : </strong>
						<span id="lastName"> </span>
					</p>
					
					<p>
						<strong>NIC : </strong>
						<span id="nic"> </span>
					</p>
				
					<p>
						<strong>Phone : </strong>
						<span id="phone"> </span>
					</p>
					
					<p>
						<strong>Email : </strong>
						<span id="email"> </span>
					</p>
					
					<p>
						<strong>Address : </strong>
						<span id="address"> </span>
					</p>
					
					<p>
						<strong>Status : </strong>
						<span id="status"> </span>
					</p>
					
					<div class="mt-4">
						
						<button type="button" id="approveBtn" class="btn btn-primary"> 
							Approve 
						</button>
						
						<button type="button" id="rejectBtn" class="btn btn-danger ms-2">
							Reject
						</button>
						
						<button type="button" id="backBtn" class="btn btn-secondary ms-2">
							Back
						</button>
						
					</div>
					
				</div>
			
			</div>
	
	</div>

<!-- JAVASCRIPT -->

<script src="../js/customer-registration-details.js"></script>

</body>
</html>
