<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Customer Details</title>

<!-- =====================================================
     BOOTSTRAP
     ===================================================== -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<!-- =====================================================
     OUR GLOBAL CSS
     ===================================================== -->

<link
    rel="stylesheet"
    href="../css/style.css"
>


</head>

<body>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-dark ">

    <div class="container">

        <!-- SYSTEM NAME -->

        <a
            class="navbar-brand"
            href="dashboard.html"
        >
            Loan Management System
        </a>

        <!-- NAVIGATION -->

        <div>

            <a
                class="btn btn-outline-light me-2"
                id="dashboard"
            >
                Dashboard
            </a>

            <button
                type="button"
                class="btn btn-outline-light"
                id="logout"
            >
                Logout
            </button>

        </div>

    </div>

</nav>

<!-- =====================================================
     PAGE CONTENT
     ===================================================== -->

<main>

    <div class="container page-container py-5">

        <!-- =================================================
             PAGE HEADER
             ================================================= -->

        <div class="page-header">

            <h2>
                Customer Details
            </h2>

            <p>
                View the details of the selected customer.
            </p>

        </div>

        <!-- =================================================
             CUSTOMER INFORMATION CARD
             ================================================= -->

        <div class="page-card mb-4">

            <!-- CARD HEADER -->

            <div class="card-header">

                <h5>
                    Customer Information
                </h5>

            </div>

            <!-- CARD BODY -->

            <div class="card-body">

                <div class="row g-4">

                    <!-- CUSTOMER ID -->

                    <div class="col-md-6">

                        <div class="fw-semibold text-muted mb-1">
                            Customer ID
                        </div>

                        <div id="customerID">
                        </div>

                    </div>

                    <!-- FIRST NAME -->

                    <div class="col-md-6">

                        <div class="fw-semibold text-muted mb-1">
                            First Name
                        </div>

                        <div id="firstName">
                        </div>

                    </div>

                    <!-- LAST NAME -->

                    <div class="col-md-6">

                        <div class="fw-semibold text-muted mb-1">
                            Last Name
                        </div>

                        <div id="lastName">
                        </div>

                    </div>

                    <!-- NIC -->

                    <div class="col-md-6">

                        <div class="fw-semibold text-muted mb-1">
                            NIC
                        </div>

                        <div id="nic">
                        </div>

                    </div>

                    <!-- PHONE -->

                    <div class="col-md-6">

                        <div class="fw-semibold text-muted mb-1">
                            Phone
                        </div>

                        <div id="phone">
                        </div>

                    </div>

                    <!-- EMAIL -->

                    <div class="col-md-6">

                        <div class="fw-semibold text-muted mb-1">
                            Email
                        </div>

                        <div id="email">
                        </div>

                    </div>

                    <!-- ADDRESS -->

                    <div class="col-12">

                        <div class="fw-semibold text-muted mb-1">
                            Address
                        </div>

                        <div id="address">
                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- =================================================
             CUSTOMER ACTIONS
             ================================================= -->

        <div class="page-card">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                    <div>

                        <h5 class="card-title mb-1">
                            Customer Actions
                        </h5>

                        <p class="card-text mb-0">
                            Edit customer information or return to the customer list.
                        </p>

                    </div>

                    <div>

                        <button
                            type="button"
                            class="btn btn-primary"
                            id="editCustomerBtn"
                        >
                            Edit Customer
                        </button>

                        <button
                            type="button"
                            class="btn btn-secondary ms-2"
                            id="backBtn"
                        >
                            Back
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="../js/customer-details.js"></script>


</body>

</html>
