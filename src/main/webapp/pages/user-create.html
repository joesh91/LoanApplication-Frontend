<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Details</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>
<body>

	<!--  NAV BAR  -->
		<nav class="navbar navbar-dark bg-dark">
		
		<div class="container">
		
			<a class="navbar-brand" id="dashboard">
				Loan Management System
			</a>
			
			<div>
			<a class="btn btn-outline-light me-2" id="dashboard">
				Dashboard
			</a>
			
			<button type="button" class="btn btn-outline-light" id="logout">
				Logout
			</button>
			</div>
		</div>
	</nav>
	<div class="container mt-5">

		<div class="card shadow">

			<div class="card-header mb-3">
				<h4 class="mb-0">Create User</h4>
			</div>

			<div class="card-body">

				<form id="userEditForm">

					<!-- User ID -->

					<div class="mb-3">

						<label for="userId" class="form-label"> User ID </label> <input
							type="text" class="form-control" id="userId" readonly />

					</div>

					<!-- Username -->

					<div class="mb-3">

						<label for="userName" class="form-label"> Username </label> <input
							type="text" class="form-control" id="userName" required />

					</div>
					
					<!--  

					<div class="mb-3">

						<label for="passWord" class="form-label" hidden> Password </label> <input
							type="password" class="form-control" id="passWord" required readonly hidden/>

					</div>
-->


					<!-- Role -->

					<div class="mb-3">

						<label for="role" class="form-label"> Role </label> <input
							type="text" class="form-control" id="role" required />

					</div>

					<!-- Customer ID -->

					<div class="mb-3">

						<label for="customerId" class="form-label"> Customer ID </label> <input
							type="text" class="form-control" id="customerId" required />

					</div>

					<div id="userMessage"></div>

					<div class="mt-2 mb-3">

						<button type="button" class="btn btn-primary"
							id="createUserButton">Update user</button>

						<button type="button" class="btn btn-secondary ms-2"
							id="backButton">Cancel</button>

					</div>

				</form>

			</div>

		</div>

	</div>
	<script src="../js/user-create.js"></script>
</body>
</html>
