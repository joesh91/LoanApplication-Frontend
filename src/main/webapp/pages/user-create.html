<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Create User</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Global Custom CSS -->
<link
    rel="stylesheet"
    href="../css/style.css">


</head>

<body>

<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-dark ">

    <div class="container">

        <a
            class="navbar-brand"
            href="dashboard.html">

            Loan Management System

        </a>

        <div>

            <a
                class="btn btn-outline-light me-2"
                id="dashboard">

                Dashboard

            </a>

            <button
                type="button"
                class="btn btn-outline-light"
                id="logout">

                Logout

            </button>

        </div>

    </div>

</nav>


<!-- =====================================================
     PAGE CONTENT
     ===================================================== -->

<main>

    <div class="container page-container py-5">

        <!-- PAGE HEADER -->

        <div class="page-header">

            <h2>Create User</h2>

            <p>
                Create a new system user for the Loan Management System.
            </p>

        </div>


        <!-- =================================================
             USER FORM
             ================================================= -->

        <div class="page-card">

            <div class="card-header">

                <h5>User Information</h5>

            </div>


            <div class="card-body">

                <form id="userEditForm">

                    <div class="row g-4">

                        <!-- USER ID -->

                        <div class="col-md-6">

                            <label
                                for="userId"
                                class="form-label fw-semibold">

                                User ID

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="userId"
                                readonly>

                        </div>


                        <!-- USERNAME -->

                        <div class="col-md-6">

                            <label
                                for="userName"
                                class="form-label fw-semibold">

                                Username

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="userName"
                                required>

                        </div>


                        <!-- ROLE -->

                        <div class="col-md-6">

                            <label
                                for="role"
                                class="form-label fw-semibold">

                                Role

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="role"
                                required>

                        </div>


                        <!-- CUSTOMER ID -->

                        <div class="col-md-6">

                            <label
                                for="customerId"
                                class="form-label fw-semibold">

                                Customer ID

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="customerId"
                                required>

                        </div>

                    </div>


                    <!-- MESSAGE -->

                    <div
                        id="userMessage"
                        class="mt-4">

                    </div>


                    <!-- =================================================
                         ACTION BUTTONS
                         ================================================= -->

                    <div class="d-flex flex-wrap gap-2 mt-4">

                        <button
                            type="button"
                            class="btn btn-primary"
                            id="createUserButton">

                            Create User

                        </button>


                        <button
                            type="button"
                            class="btn btn-secondary"
                            id="backButton">

                            Cancel

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</main>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="../js/user-create.js"></script>


</body>

</html>
